<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Stellar Codebase Impact Engine</title>
  <meta name="description" content="Create your Stellar account to trace blast radius, evaluate code risks, and safeguard production deployments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/globals.css">
</head>
<body>
  <div class="auth-viewport">
    <div class="auth-ambient-glow"></div>
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-brand-link" title="Return to Stellar Home">
          <div class="auth-brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </div>
          <div class="auth-brand-name">Stellar</div>
          <div class="auth-brand-chip">NEW WORKSPACE</div>
        </a>
        <h1 class="auth-title">Create your Stellar account</h1>
        <p class="auth-subtitle">Detect blast radius and risky diffs before they hit production.</p>
      </div>

      <div class="auth-social-group">
        <button type="button" class="auth-social-btn" onclick="simulateOAuth('GitHub')">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>Sign up with GitHub</span>
        </button>

        <button type="button" class="auth-social-btn" onclick="simulateOAuth('Google')">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Sign up with Google</span>
        </button>
      </div>

      <div class="auth-divider">
        <div class="auth-divider-line"></div>
        <span class="auth-divider-text">Or register with work email</span>
        <div class="auth-divider-line"></div>
      </div>

      <form class="auth-form" id="signUpForm" onsubmit="handleSignUpSubmit(event)">
        <div class="auth-field">
          <label class="auth-label" for="signupName">Full Name</label>
          <input type="text" id="signupName" class="auth-input" placeholder="Alex Chen" required autocomplete="name">
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signupEmail">Work Email</label>
          <input type="email" id="signupEmail" class="auth-input" placeholder="alex@company.com" required autocomplete="email">
        </div>

        <div class="auth-field">
          <div class="auth-label-row">
            <label class="auth-label" for="signupOrg">Organization / Team Name</label>
            <span class="strength-label">Optional</span>
          </div>
          <input type="text" id="signupOrg" class="auth-input" placeholder="Acme Engineering" autocomplete="organization">
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signupPassword">Password</label>
          <input type="password" id="signupPassword" class="auth-input" placeholder="Create a secure password" required autocomplete="new-password" oninput="checkStrength(this.value)">
          <div class="auth-strength-meter">
            <div class="strength-bar" id="bar1"></div>
            <div class="strength-bar" id="bar2"></div>
            <div class="strength-bar" id="bar3"></div>
            <div class="strength-bar" id="bar4"></div>
          </div>
          <div class="strength-label" id="strengthText">Must be at least 8 characters</div>
        </div>

        <p class="auth-terms">By creating an account, you agree to our Terms of Service and Privacy Policy.</p>

        <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; justify-content: center; margin-top: var(--space-2);">
          <span>Create Account</span>
        </button>
      </form>

      <div class="auth-footer-nav">
        <span>Already have an account?</span>
        <a href="/signin.html" class="auth-link">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    function simulateOAuth(provider) {
      const btn = event.currentTarget;
      btn.style.opacity = '0.7';
      btn.style.pointerEvents = 'none';
      btn.querySelector('span').textContent = `Connecting to ${provider}…`;
      setTimeout(() => {
        window.location.href = '/';
      }, 900);
    }

    function checkStrength(val) {
      const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3'), document.getElementById('bar4')];
      const text = document.getElementById('strengthText');
      bars.forEach(b => { b.className = 'strength-bar'; });

      if (!val) {
        text.textContent = 'Must be at least 8 characters';
        text.style.color = 'var(--text-muted)';
        return;
      }

      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      if (score === 1) {
        bars[0].className = 'strength-bar active-weak';
        text.textContent = 'Weak password';
        text.style.color = 'var(--error)';
      } else if (score === 2) {
        bars[0].className = 'strength-bar active-fair';
        bars[1].className = 'strength-bar active-fair';
        text.textContent = 'Fair — add numbers or symbols';
        text.style.color = 'var(--warning)';
      } else if (score === 3) {
        bars[0].className = 'strength-bar active-good';
        bars[1].className = 'strength-bar active-good';
        bars[2].className = 'strength-bar active-good';
        text.textContent = 'Good password';
        text.style.color = '#60A5FA';
      } else if (score >= 4) {
        bars[0].className = 'strength-bar active-strong';
        bars[1].className = 'strength-bar active-strong';
        bars[2].className = 'strength-bar active-strong';
        bars[3].className = 'strength-bar active-strong';
        text.textContent = 'Strong password';
        text.style.color = 'var(--success)';
      }
    }

    function handleSignUpSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const span = btn.querySelector('span');
      btn.disabled = true;
      span.textContent = 'Creating account…';
      setTimeout(() => {
        window.location.href = '/';
      }, 850);
    }
  </script>
</body>
</html>
